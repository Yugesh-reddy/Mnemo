name: correctness
on: [push, pull_request]
jobs:
  correctness:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MNEMO_DB: ${{ github.workspace }}/.ci/mnemo.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: make lint
      - run: make test
      - run: make migrate
      - run: make demo
      - run: uv build
      - run: bash scripts/check-wheel.sh
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheel
          path: dist/*.whl
