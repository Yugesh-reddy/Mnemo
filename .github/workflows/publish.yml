name: publish
# Publishes to PyPI as `mnemohive` when a GitHub release is published, through PyPI
# trusted publishing: no token is stored; PyPI trusts this workflow in the `pypi`
# environment of this repository.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
      - name: The release tag names the version being built
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - run: uv sync --locked --extra dev
      - run: make test
      - run: uv build
      - run: bash scripts/check-wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mnemohive/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv publish --trusted-publishing always dist/*
