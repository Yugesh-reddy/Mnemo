services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mnemo-db
    environment:
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD: mnemo
      POSTGRES_DB: mnemo
    ports:
      - "5432:5432"
    volumes:
      - mnemo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo -d mnemo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mnemo-pgdata:
