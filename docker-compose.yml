services:
  # The container is named after the Compose project (by default the checkout's
  # directory), so separate checkouts can each run one; give them different
  # MNEMO_DB_PORT values.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD: mnemo
      POSTGRES_DB: mnemo
    ports:
      # Local connections only; set MNEMO_DB_PORT (e.g. in .env) if 5432 is taken.
      - "127.0.0.1:${MNEMO_DB_PORT:-5432}:5432"
    volumes:
      - mnemo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo -d mnemo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mnemo-pgdata:
