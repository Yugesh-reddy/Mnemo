[project]
name = "mnemo"
version = "0.0.1"
description = "Agent memory that stores less and remembers what matters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
nli = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemo", "web", "examples"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "mnemo/migrations"

[tool.hatch.build.targets.sdist]
include = ["mnemo", "web", "examples", "migrations", "tests", "docs", "README.md", "PROJECT_SPEC.md", "PROJECT_STATUS.md", "Makefile", "docker-compose.yml", "pyproject.toml"]

[project.scripts]
mnemo-migrate = "mnemo.db:main"
mnemo-mcp = "mnemo.mcp_server:main"
mnemo-worker = "mnemo.worker:main"
mnemo-eval = "mnemo.eval:main"
mnemo-demo = "examples.agent:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Form() in argument defaults is idiomatic (bugbear false positive).
"web/app.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
