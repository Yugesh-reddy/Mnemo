[project]
name = "mnemohive"
version = "0.1.3"
description = "One shared, versioned memory for your coding agents (Claude Code, Codex, OpenCode) over MCP, in one local file."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mcp", "memory", "coding-agents", "claude-code", "codex", "opencode", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "fastembed>=0.9.1,<0.10",
    "sqlite-vec>=0.1.9,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "mnemo/migrations"

[tool.hatch.build.targets.sdist]
include = ["mnemo", "examples", "migrations", "scripts", "tests", "docs", "README.md", "PROJECT_SPEC.md", "PROJECT_STATUS.md", "Makefile", "pyproject.toml", "uv.lock"]
# Eval and pilot evidence (raw transcripts) stays in the repository, not the sdist.
exclude = ["docs/agent-eval/runs", "docs/direct-pilot"]

[project.urls]
Homepage = "https://github.com/Yugesh-reddy/Mnemo"
Source = "https://github.com/Yugesh-reddy/Mnemo"
Issues = "https://github.com/Yugesh-reddy/Mnemo/issues"
Changelog = "https://github.com/Yugesh-reddy/Mnemo/releases"

[project.scripts]
mnemo = "mnemo.cli:main"
mnemo-migrate = "mnemo.db:main"
mnemo-mcp-direct = "mnemo.mcp_direct:main"
mnemo-transfer = "mnemo.transfer:main"
mnemo-install = "mnemo.install:main"

[tool.ruff]
line-length = 100
target-version = "py312"
# Recorded eval evidence (including the scripts that produced it) stays byte-for-byte.
extend-exclude = ["docs/agent-eval/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Form() in argument defaults is idiomatic (bugbear false positive).
"mnemo/web/app.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "docs/agent-eval/runs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
