<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mnemo</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.js"></script>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { font-feature-settings: "tnum"; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="border-b bg-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center gap-6">
      <a href="/" class="font-semibold text-lg">Mnemo
        <span class="text-slate-400 font-normal text-sm">— git for agent memory</span></a>
      <nav class="ml-auto flex gap-4 text-sm">
        <a href="/" class="hover:text-indigo-600">Memory</a>
        <a href="/diff" class="hover:text-indigo-600">Diff</a>
        <a href="/operations" class="hover:text-indigo-600">Operations</a>
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
